
name: Build Ilyes Water APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create app
        run: flutter create ilyes_water

      - name: Build APK
        run: |
          cd ilyes_water
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Ilyes-Water-APK
          path: ilyes_water/build/app/outputs/flutter-apk/app-release.apk
